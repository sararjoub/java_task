<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Ordering System</title>

    <link rel="stylesheet" href="task6.css">
</head>

<body>

    <div class="container">

        <h1>Restaurant Order</h1>

        <form id="orderForm">

            
            <label>Username:</label>
            <input type="text" id="username" placeholder="Enter your username">

            
            <!-- Password -->
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            
            <label> Phone Number:</label>
            <input type="text" id="phone"  placeholder="07XXXXXXXX" >

            <label>Choose your order:</label>

            <select id="order">
                <option value="Burger">Burger</option>
                <option value="Shawarma">Shawarma</option>
                <option value="Zinger">Zinger</option>
            </select>

            <button type="submit" id="submitButton">
                Submit Order
            </button>

        </form>

    
        <div class="result" id="result">
            
        </div>

    </div>

    <script src="task6.js"></script>

</body>

</html>
